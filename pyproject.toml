[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dort-input"
version = "0.4.1"
description = "R-Z input preparation and VARFLM flux post-processing for DORT"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Anupam Chakraborty"},
]
keywords = ["DORT", "discrete ordinates", "radiation transport", "shielding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
dort-mixture = "dort_input.mixture:main"

[project.urls]
Repository = "https://github.com/Anupam-IGC/DORT_Input"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
